[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=mikos-server
OutputDirectory=/src/out/images

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0 console=tty0
WithDocs=no
Hostname=mikos
PackageDirectories=/src/out/debs
Packages=
        apt
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-resolved
        udev
        dbus
        mikos-server
