[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=mikos-server
OutputDirectory=/src/out/images

[Content]
Bootable=yes
Bootloader=systemd-boot
# Kernel command line lives in mkosi.extra/etc/kernel/cmdline: mkosi uses it as the
# base of its boot entry (KernelCommandLine= would be appended, duplicating it) and
# kernel-install reuses it on kernel updates, whose initramfs-tools initrd needs root=.
WithDocs=no
Hostname=mikos
PackageDirectories=/src/out/debs
Packages=
        apt
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-resolved
        udev
        dbus
        mikos-server
