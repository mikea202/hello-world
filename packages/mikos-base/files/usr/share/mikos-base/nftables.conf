#!/usr/sbin/nft -f
# Mikos base firewall. Only the "inet mikos" table is replaced on reload, so
# tables owned by others (fail2ban's f2b-table, container or router rules) survive.
# Add rules from /etc/nftables.d/*.nft, e.g.
#   add rule inet mikos input_extra tcp dport 443 accept
# To restrict or move SSH:  flush chain inet mikos allow_ssh  (then add your own rule)
# Forwarding (router/containers):  add rule inet mikos forward_extra ...
destroy table inet mikos

table inet mikos {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		jump allow_ssh
		jump input_extra
	}

	chain allow_ssh {
		tcp dport 22 accept
	}

	chain input_extra {
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		jump forward_extra
	}

	chain forward_extra {
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
